# varstar-pipeline — configuration par défaut
# Copier en config.yaml et ajuster. Toute clé absente prend la valeur par défaut.

paths:
  workdir: null                 # défaut : <dossier_source>/../varstar_work/<nom_dossier>
  library: ~/varstar_library    # bibliothèque de masters partagée entre cibles
  siril_cli: /Applications/Siril.app/Contents/MacOS/siril-cli
  astap_cli: null               # ex. /Applications/ASTAP.app/Contents/MacOS/astap
  pixinsight_masters: auto      # validation croisée : auto = <source>/output/master ; null pour désactiver

inventory:
  ignore_dirs: [removed, output, "*.pxiproject"]
  include_removed: false
  extensions: [.fits, .fit, .fts]
  session_day_offset_hours: -12   # une nuit = une session
  set_gap_hours: 3                # écart qui sépare deux séries de calibration (darks, flats)
  read_pixels_for_units: true     # lit une image par capteur pour détecter le facteur ADU (×4)

matching:
  exptime_tolerance_s: 0.01
  darkflat_exptime_tolerance_s: 0.05
  temp_tolerance_c: 1.5
  max_flat_age_days: 7
  flat_same_session_hours: 16    # flats pris à moins de 16 h des lights = même session (flats du matin)
  trust_session_folder_flats: true  # flats d'un même dossier SESSION_xxx acceptés (question Q3), avec avertissement
  same_optical_setup:            # périodes où le montage n'a pas bougé (flats partageables)
    # - [2021-09-02, 2021-09-07]  # à décommenter si confirmé (question Q1)
  allow_dark_scaling: true       # repli niveau B
  dark_same_night: true          # darks de la même nuit que les lights uniquement ; jamais deux nuits mélangées (D16)

masters:
  rejection_auto: true           # choix selon N (voir SPEC §4.2)
  sigma_low: 3.0
  sigma_high: 3.0
  percentile_low: 0.2            # rejet par percentile (N < 8)
  percentile_high: 0.1
  flat_level_min_frac: 0.15
  flat_level_max_frac: 0.85

masks:                           # σ = bruit temporel d'une seule pose de dark
  hot_pixel_sigma: 5.0           # pixels « tièdes » (bien corrigés par le dark, information)
  hot_pixel_severe_sigma: 50.0   # pixels « très chauds »
  cold_pixel_sigma: 5.0
  unstable_sigma_factor: 5.0     # bruit temporel du pixel > 5 × bruit médian → instable (RTS)
  dead_pixel_flat_frac: 0.5      # pixel < 50 % du flat normalisé local
  flat_local_block_px: 32
  amp_glow_detect: true
  amp_glow_block_px: 64          # lissage par médiane de blocs
  amp_glow_sigma: 5.0            # bloc > niveau + 5 σ(blocs) → zone d'amp glow
  amp_glow_min_adu: 2.0
  bad_pixel_flags: [very_hot, unstable, cold, dead, saturated]   # bits qui marquent une mesure (M4)

qa:                              # contrôles qualité précoces (docs/QA_CHECKS.md)
  ccd_temp_delta_c: 1.0          # H3 : |CCD-TEMP − SET-TEMP| toléré, image par image
  focpos_tolerance_steps: 100    # H5 : écart de mise au point flats / lights
  pointing_max_field_frac: 0.10  # H6 : décalage du pointage toléré (fraction du champ)
  cloud_cover_max: 50            # H7 : CLOUDCVR (%, souvent issu d'une météo en ligne : indicatif)
  dew_margin_c: 2.0              # H7 : AMBTEMP − DEWPOINT minimal
  min_darks: 15                  # H9 : en dessous, rejet moins robuste
  min_flats: 15
  pixel_step: 4                  # sous-échantillonnage des pixels pour les statistiques rapides
  offset_jump_adu: 5.0           # P1 : écart de niveau entre séries de darks de même pose
  leak_frame_excess_adu: 3.0     # P2 : excès d'une pose par rapport à sa série
  flat_compare: true             # P4 : comparaison des flats successifs d'un même filtre
  flat_compare_max_frames: 7
  flat_compare_bin: 8
  flat_dust_pct: 1.0             # P4 : structure locale (poussière) tolérée, en %
  flat_shape_pct: 1.0            # P4 : écart de forme à grande échelle toléré, en %
  dark_above_light_adu: 3.0      # P8 : plancher des lights sous celui des darks → offset différent
  calibrated_background_min_adu: 0.0   # C3 : fond calibré minimal attendu

astrometry:
  engine: auto                   # auto | siril | astap
  pixel_scale_arcsec: null       # défaut : calculé depuis FOCALLEN et XPIXSZ
  search_radius_deg: 5

quality:
  fwhm_max_factor: 1.8
  min_star_fraction: 0.5         # rejet si < 50 % des étoiles de la meilleure image
  zp_drop_max_mag: 0.7

catalog:
  source: gaia_dr3
  mag_limit_g: 15.0
  contamination_delta_mag: 2.5

photometry:
  k_aperture: 1.5                # × FWHM
  extra_apertures: [1.0, 2.0]
  annulus_in: 4.0
  annulus_out: 7.0
  saturation_frac: 0.85
  read_noise_e: 1.5              # à affiner (gain 120, ASI294MM)
  recenter_max_px: 1.0
  min_snr: 20

differential:
  ensemble_iterations: 5
  field_term: auto               # auto (actif en niveau C) | none | linear | quadratic

detection:
  min_points: 10
  n_sigma_envelope: 5.0
  stetson_pair_max_dt_min: 15
  require_independent_confirmation: true
  lomb_scargle: true
  vsx_match_radius_arcsec: 7.0

runtime:
  processes: 6
  log_level: INFO
