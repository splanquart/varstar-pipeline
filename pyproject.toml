[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varstar"
version = "0.1.0"
description = "Raw N.I.N.A. frames -> calibration -> astrometry -> differential photometry -> variable star detection"
requires-python = ">=3.11"
dependencies = [
    "numpy", "scipy", "astropy", "photutils", "astroquery", "pyvo", "requests", "pandas",
    "matplotlib", "pyyaml", "typer",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis"]

[project.scripts]
varstar = "varstar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
varstar = ["defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools"]
markers = [
    "real_data: integration tests on the real NGC1499 dataset (disabled by default)",
    "siril: needs the real siril-cli (skipped automatically when absent)",
    "slow: slower tests (deselect with -m 'not slow')",
    "network: needs internet access (Gaia TAP services); deselected by default",
]
addopts = "-m 'not real_data and not network'"

[tool.coverage.run]
source = ["varstar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
